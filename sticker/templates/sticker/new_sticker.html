{% extends "sticker/layout.html" %}

{% block body %}

    <h2>New Sticker</h2>

    {% if message %}
        <div>{{ message }}</div>
    {% endif %}
    <p>My Location</p>
    <form action="{% url 'new_sticker' %}" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <input class="btn btn-primary" type="submit" value="Go!!!!!">
    </form>
<script>
    document.getElementById("id_latitude").value = sessionStorage.lat; //use user coords from session as initial value
    document.getElementById("id_longitude").value = sessionStorage.lng;
</script>
{% endblock %}
