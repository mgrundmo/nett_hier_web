<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>{% block title %}Nett hier. Aber waren Sie schon mal in Baden-Würtenberg?{% endblock %}</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=EB Garamond">
    </head>
    <body>
        {% load static %}
        <nav style="font-family: EB Garamond;" class="navbar navbar-expand-lg navbar-light bg-light">
            <a class="navbar-brand" href="#">
                <img src="{% static 'sticker/nett_hier_sticker.png' %}" alt="nett_hier_sticker" width="50" style="padding-left: 5px">
            </a>           
            <div class="container-fluid">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'index' %}">All Sticker</a>
                    </li>
                {% if user.is_authenticated %}
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'logout' %}">My Sticker</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'new_sticker' %}">New Sticker</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'logout' %}">Log Out</a>
                    </li>
                {% else %}
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'login' %}">Log In</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'register' %}">Register</a>
                    </li>                   
                {% endif %}
                </ul>
            </div>
        </nav>
        <div class="container" style="margin-top: 20px">
            {% block body %} 
            {% endblock %} 
        </div>
    </body>
</html>
